<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Handloom Creations - Artisans Support Platform</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- Dynamic Header -->
  <header></header>

  <!-- Page Header -->
  <section class="section" style="padding: 40px 0 20px 0; background-color: var(--bg-beige); border-bottom:1px solid var(--border-color);">
    <div class="container">
      <h1 style="font-size: 2.25rem;">Exquisite Heritage Marketplace</h1>
      <p style="color:var(--text-muted);">Explore hand-woven sarees, shawls, rugs and fabrics directly sourced from individual artisans.</p>
    </div>
  </section>

  <!-- Product Search & Filter Section -->
  <section class="section container">
    <div class="search-filter-wrapper">
      <div class="search-field">
        <label for="search-input">Search Creations</label>
        <input type="text" id="search-input" placeholder="Search by title, weave type, shop..." oninput="filterProducts()">
      </div>
      
      <div class="filter-select">
        <label for="category-select">Category</label>
        <select id="category-select" onchange="filterProducts()">
          <option value="All">All Categories</option>
          <option value="Saree">Traditional Sarees</option>
          <option value="Shawl">Woolen Shawls</option>
          <option value="Home Decor">Home Furnishings</option>
          <option value="Fabrics">Handloom Fabrics</option>
        </select>
      </div>

      <div class="filter-select">
        <label for="price-range">Max Price (₹)</label>
        <input type="number" id="price-range" placeholder="e.g. 5000" oninput="filterProducts()">
      </div>

      <div class="filter-select">
        <label for="sort-select">Sort By</label>
        <select id="sort-select" onchange="filterProducts()">
          <option value="newest">Newest Collection</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="products-catalog-container" class="product-grid">
      <!-- Loaded dynamically -->
      <p style="text-align:center; grid-column:1/-1; color:var(--text-muted); padding:50px;">Loading catalog items...</p>
    </div>
  </section>

  <!-- Dynamic Footer -->
  <footer></footer>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check query parameters
      const params = new URLSearchParams(window.location.search);
      const categoryParam = params.get('category');
      const artisanParam = params.get('artisan');
      
      if (categoryParam) {
        document.getElementById('category-select').value = categoryParam;
      }
      
      loadCatalog(categoryParam, artisanParam);
    });

    let currentArtisanId = null;

    async function loadCatalog(category = '', artisan = '') {
      try {
        currentArtisanId = artisan || null;
        let url = '/api/products?';
        
        if (category && category !== 'All') url += `category=${encodeURIComponent(category)}&`;
        if (artisan) url += `artisanId=${encodeURIComponent(artisan)}&`;
        
        const sortVal = document.getElementById('sort-select').value;
        url += `sort=${sortVal}`;

        const response = await fetch(url);
        const resJson = await response.json();
        
        renderProductsList(resJson.data);
      } catch (err) {
        console.error('Catalog load failure:', err);
      }
    }

    function renderProductsList(products) {
      const container = document.getElementById('products-catalog-container');
      
      if (!products || products.length === 0) {
        container.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:60px; background:#fff; border-radius:8px; border:1px solid var(--border-color);">
            <span style="font-size:3rem;">🔍</span>
            <h3 style="margin-top:15px;">No products match your search.</h3>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-top:5px;">Try clearing filters or checking for alternative spellings.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = products.map(product => `
        <div class="product-card">
          <div class="product-image-container">
            <img src="${product.imageUrl}" alt="${product.title}">
            <span class="product-badge">${product.category}</span>
            <button class="wishlist-btn" onclick="addToWishlist('${product._id}')">❤️</button>
          </div>
          <div class="product-details-content">
            <span class="product-shop">📍 ${product.artisanLocation} | ${product.shopName}</span>
            <a href="/product-details.html?id=${product._id}">
              <h3 class="product-title">${product.title}</h3>
            </a>
            <div class="product-meta">
              <span class="product-price">₹${product.price}</span>
              <span class="product-rating">
                ⭐ ${product.rating || 'New'} ${product.reviewsCount ? `(${product.reviewsCount})` : ''}
              </span>
            </div>
            <div style="margin-top:15px; display:flex; gap:10px;">
              <a href="/product-details.html?id=${product._id}" class="btn btn-outline btn-sm" style="flex:1;">Details</a>
              <button class="btn btn-primary btn-sm" style="flex:1.2;" onclick="buyProductDirectly('${product._id}')">Add to Cart</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function filterProducts() {
      const search = document.getElementById('search-input').value;
      const category = document.getElementById('category-select').value;
      const maxPrice = document.getElementById('price-range').value;
      const sort = document.getElementById('sort-select').value;
      
      let url = `/api/products?sort=${sort}&`;
      if (category && category !== 'All') url += `category=${encodeURIComponent(category)}&`;
      if (search) url += `search=${encodeURIComponent(search)}&`;
      if (maxPrice) url += `maxPrice=${maxPrice}&`;
      if (currentArtisanId) url += `artisanId=${currentArtisanId}&`;

      try {
        const response = await fetch(url);
        const resJson = await response.json();
        renderProductsList(resJson.data);
      } catch (err) {
        console.error(err);
      }
    }

    async function buyProductDirectly(id) {
      try {
        const response = await fetch(`/api/products/${id}`);
        const resJson = await response.json();
        if (resJson.success) {
          Cart.add(resJson.data, 1);
        }
      } catch (err) {
        console.error(err);
      }
    }

    function addToWishlist(id) {
      let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
      if (wishlist.includes(id)) {
        showToast('Product is already in your wishlist.', 'info');
      } else {
        wishlist.push(id);
        localStorage.setItem('wishlist', JSON.stringify(wishlist));
        showToast('Added to wishlist!', 'success');
      }
    }
  </script>
</body>
</html>
